(function(){

    get:function(k){return Promise.resolve(mem[k]?{value:mem[k]}:null)},

  if(FIREBASE_CONFIG.apiKey==="YOUR_API_KEY"){window.DB=local;return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    var db=firebase.database();
    window.DB={
      get:function(k){return db.ref(k.replace(/:/g,"_")).once("value").then(function(s){var v=s.val();return v!=null?{value:v}:null}).catch(function(){return null})},
      set:function(k,v){return db.ref(k.replace(/:/g,"_")).set(v).catch(function(){})},
      del:function(k){return db.ref(k.replace(/:/g,"_")).remove().catch(function(){})}
    };
  }catch(e){console.error(e);window.DB=local}
})();

function card(ex){return "background:var(--bg1);border:.5px solid var(--br3);border-radius:var(--rlg)"+(ex?";"+ex:"")}
function card2(ex){return "background:var(--bg2);border:.5px solid var(--br3);border-radius:var(--rlg)"+(ex?";"+ex:"")}
function lbl(ex){return "font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono);color:var(--tx2)"+(ex?";"+ex:"")}
function logoDiv(sz){return "<div class=\"logo\" style=\"width:"+sz+"px;height:"+sz+"px\"></div>"}

function render(){
  var root=document.getElementById("root");
  if(!S.user){root.innerHTML=renderUserSelect();return}
  if(!S.loaded){root.innerHTML="<p style=\"padding:3rem;text-align:center;font-family:var(--mono);color:var(--tx2);font-size:12px;letter-spacing:.1em\">LOADING...</p>";return}
  var html=renderHeader()+renderNav();
  if(S.tab==="manual") html+=renderManual();
  else if(S.tab==="milestone") html+=renderMilestone();
  else if(S.tab==="clock"&&!isMgr()) html+=renderClock();
  else if(S.tab==="board") html+=renderBoard();
  if(S.showMeeting) html+=renderMeetingModal();
  root.innerHTML=html;
}

    "</div>"+

        "<button onclick=\"window.A.selectUser(-1)\" style=\""+card2("display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;text-align:left;border-left:3px solid var(--br2);position:relative")+"\">"+

        "<div style=\"width:32px;height:32px;border-radius:50%;background:"+(c?c+"18":"var(--bg3)")+";color:"+(c||"var(--tx2)")+";border:1.5px solid "+(c?c+"40":"var(--br3)")+";display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;font-family:var(--mono)\">"+esc(init)+"</div>"+

function renderNav(){
  var tabs=[{id:"manual",l:"マニュアル"},{id:"milestone",l:"マイルストーン"}];
  if(!isMgr()) tabs.push({id:"clock",l:"打刻"});
  tabs.push({id:"board",l:"作業ボード"});
  var btns="";
  for(var i=0;i<tabs.length;i++){
    var t=tabs[i];var a=S.tab===t.id;
    btns+="<button onclick=\"window.A.setTab('"+t.id+"')\" style=\"padding:11px 14px;font-size:12px;color:"+(a?B:"var(--tx2)")+";border:none;border-bottom:"+(a?"2px solid "+B:"2px solid transparent")+";background:none;cursor:pointer;white-space:nowrap;font-weight:"+(a?500:400)+";margin-bottom:-1px\">"+t.l+"</button>";
  }
  return "<div style=\"display:flex;border-bottom:.5px solid var(--br3);padding:0 16px;overflow-x:auto;background:var(--bg2)\">"+btns+"</div>";
}

function renderMtgSection(){
  var pending=S.meetingReqs.filter(function(r){return !r.done});

  var html="<div style=\"margin-bottom:20px\">"+
    "<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px\">"+
      "<div style=\""+lbl("color:#2563A8")+"\">" +
        (pending.length>0?"<span style=\"background:#E24B4A;color:white;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;margin-right:6px;font-family:var(--mono)\">"+pending.length+"</span>":"") +
        "ミーティング依頼" +

    "</div>";
  if(pending.length===0){
    html+="<div style=\"font-size:12px;color:var(--tx2);padding:12px 0;text-align:center\">未対応の依頼はありません</div>";

    for(var i=0;i<pending.length;i++){
      var r=pending[i];
      var uc=IC[r.user]||B;
      html+="<div style=\""+card("padding:13px 15px;margin-bottom:8px;border-left:3px solid #2563A8")+"\">"+
        "<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">"+

        "</div>"+
        "<div style=\"font-size:12px;color:var(--tx2);line-height:1.7;white-space:pre-wrap;background:var(--bg2);padding:9px 11px;border-radius:var(--rmd);margin-bottom:10px\">"+esc(r.msg||"")+"</div>"+
        "<button onclick=\"window.A.markMtgDone("+r.id+")\" style=\"font-size:11px;padding:5px 12px;background:"+B+";color:white;border:none;border-radius:var(--rmd)\">対応済みにする</button>"+
      "</div>";
    }
  }
  for(var i=0;i<done.length;i++){
    var r=done[i];
    html+="<div style=\""+card2("padding:10px 14px;margin-bottom:6px;opacity:.6")+"\">"+
      "<div style=\"display:flex;align-items:center;justify-content:space-between\">"+
        "<div style=\"display:flex;align-items:center;gap:8px\">"+

          "<div style=\"font-size:12px;font-weight:500\">"+esc(r.user||"")+"</div>"+
        "</div>"+
        "<span style=\"font-size:9px;color:var(--tx2);background:var(--bg3);padding:2px 8px;border-radius:10px;font-family:var(--mono)\">対応済み</span>"+
      "</div>"+
    "</div>";
  }
  html+="</div><div style=\"height:.5px;background:var(--br3);margin-bottom:20px\"></div>";
  return html;

  }else{

      "<div style=\""+card2("padding:14px 16px")+"\">" +

      "</div>"+
      "<div style=\"flex:1\"><div style=\"font-size:13px;font-weight:500\">マネージャーにミーティングを依頼</div><div style=\"font-size:11px;color:var(--tx2);margin-top:1px\">相談・進捗確認・振り返りなど</div></div>"+

    "</button>";
  }
  html+="<div style=\""+lbl("margin-bottom:12px")+"\">" + "業務フロー — 全7ステップ" + "</div>";
  for(var i=0;i<STEPS.length;i++){
    var s=STEPS[i];
    var isO=S.openStep===s.n;
    html+="<div style=\""+card("overflow:hidden;border-left:3px solid "+(isO?B:"transparent")+";margin-bottom:8px")+"\">"+
      "<button onclick=\"window.A.toggleStep("+s.n+")\" style=\"width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;background:none;border:none;cursor:pointer;text-align:left\">"+

  html+="</div></div>";
  return html;

        "<span style=\"font-size:11px;color:#2D6A4F;font-weight:500;font-family:var(--mono);letter-spacing:.05em\">REC</span>"+
      "</div><br>"+
      "<div id=\"clock-display\" style=\"font-size:42px;font-weight:500;font-family:var(--mono);letter-spacing:.04em;line-height:1\">"+fmtE(ms)+"</div>"+
      "<div style=\"font-size:12px;color:var(--tx2);margin-top:8px;font-family:var(--mono)\">START "+fmtT(S.clockIn)+"</div>"+
      "<div id=\"clock-wage\" style=\"font-size:14px;color:"+B+";margin-top:10px;font-weight:500;font-family:var(--mono)\">&#x00A5;"+wage(Math.floor(ms/60000)).toLocaleString()+"</div>"+
      "<button onclick=\"window.A.clockOut()\" style=\"margin-top:18px;padding:11px 40px;background:#B02A2A;color:white;border:none;border-radius:var(--rmd);font-size:14px;font-weight:500\">退勤する</button>"
      :
      "<div style=\"display:inline-flex;align-items:center;gap:7px;background:var(--bg3);border:.5px solid var(--br3);border-radius:20px;padding:4px 12px;margin-bottom:14px\">"+
        "<div style=\"width:7px;height:7px;border-radius:50%;background:var(--tx2);opacity:.4\"></div>"+
        "<span style=\"font-size:11px;color:var(--tx2);font-family:var(--mono);letter-spacing:.05em\">STANDBY</span>"+
      "</div><br>"+
      "<div style=\"font-size:42px;font-weight:500;font-family:var(--mono);color:var(--tx2);letter-spacing:.04em;line-height:1\">--:--:--</div>"+
      "<div style=\"font-size:12px;color:var(--tx2);margin-top:8px\">出勤ボタンを押して開始してください</div>"+
      "<button onclick=\"window.A.clockIn()\" style=\"margin-top:18px;padding:11px 40px;background:#2D6A4F;color:white;border:none;border-radius:var(--rmd);font-size:14px;font-weight:500\">出勤する</button>"
    )+"</div>";
  html+="<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px\">"+
    "<div style=\""+card2("padding:12px 14px")+"\">" +
      "<div style=\""+lbl("margin-bottom:5px")+"\">" + "今月の合計" + "</div>" +
      "<div style=\"font-size:22px;font-weight:500;font-family:var(--mono)\">" + Math.floor(tot/60) + "h " + (tot%60) + "m</div>" +
    "</div>" +
    "<div style=\"padding:12px 14px;border-radius:var(--rlg);background:"+BF+";border:.5px solid "+B+"25\">" +
      "<div style=\""+lbl("margin-bottom:5px;color:"+B)+"\">" + "今月の給与" + "</div>" +
      "<div style=\"font-size:22px;font-weight:500;font-family:var(--mono);color:"+B+"\">&#x00A5;"+wage(tot).toLocaleString()+"</div>" +
    "</div>" +
  "</div>";
  html+="<div style=\""+lbl("margin-bottom:10px")+"\">" + "勤怠記録" + "</div>";
  if(!S.records.length){
    html+="<div style=\""+card2("font-size:12px;color:var(--tx2);text-align:center;padding:28px 0")+"\">" + "記録がありません" + "</div>";
  }else{
    for(var i=0;i<S.records.length;i++){
      var r=S.records[i];
      html+="<div style=\""+card("display:flex;justify-content:space-between;align-items:center;padding:11px 14px;margin-bottom:6px")+"\">"+
        "<div><div style=\"font-size:13px;font-weight:500\">"+esc(r.date)+"</div>"+
          "<div style=\"font-size:11px;color:var(--tx2);margin-top:2px;font-family:var(--mono)\">"+esc(r.clockIn)+" &#x2014; "+esc(r.clockOut)+"</div></div>"+
        "<div style=\"text-align:right\"><div style=\"font-size:13px;font-weight:500;font-family:var(--mono)\">"+Math.floor(r.durationMin/60)+"h "+r.durationMin%60+"m</div>"+
          "<div style=\"font-size:11px;color:"+B+";margin-top:2px;font-family:var(--mono)\">&#x00A5;"+wage(r.durationMin).toLocaleString()+"</div></div>"+
      "</div>";
    }
  }
  html+="</div>";
  return html;
}

function renderBoard(){
  var vi=isMgr()?(S.selBoard||INTERNS[0]):S.user;
  var board=S.boards[vi]||[];
  var col=IC[vi]||B;
  var html="<div style=\"padding:18px 16px\">";
  if(isMgr()){
    html+="<div style=\"display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap\">";
    for(var i=0;i<INTERNS.length;i++){
      var n=INTERNS[i];var ic=IC[n];var act=(S.selBoard||INTERNS[0])===n;
      html+="<button onclick=\"window.A.selBoard("+i+")\" style=\"padding:6px 13px;font-size:12px;background:"+(act?ic+"18":"var(--bg2)")+";color:"+(act?ic:"var(--tx2)")+";border:.5px solid "+(act?ic:"var(--br3)")+";border-radius:var(--rmd);cursor:pointer;font-weight:"+(act?500:400)+"\">"+esc(n)+"</button>";
    }
    html+="</div>";
  }
  html+="<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">"+
    "<div style=\"width:10px;height:10px;border-radius:50%;background:"+col+"\"></div>"+
    "<div style=\"font-size:14px;font-weight:500;flex:1\">"+esc(vi)+"の作業ボード</div>"+
    "<div style=\""+lbl("font-size:9px")+"\">"+board.length+" TASKS</div>"+
  "</div>";
  if(!isMgr()){
    html+="<div style=\"display:flex;gap:8px;margin-bottom:16px\">"+
      "<input id=\"new-task-input\" type=\"text\" value=\"\" placeholder=\"新しいタスクを追加&#x2026;\" oninput=\"window.A.setNTV(this.value)\" onkeydown=\"if(event.key==='Enter')window.A.addTask()\" style=\"flex:1;font-size:13px\">"+
      "<button onclick=\"window.A.addTask()\" style=\"padding:8px 16px;background:"+B+";color:white;border:none;border-radius:var(--rmd);font-size:13px;font-weight:500;flex-shrink:0;white-space:nowrap\">追加</button>"+
    "</div>";
  }
  if(!board.length){
    html+="<div style=\""+card2("font-size:13px;color:var(--tx2);text-align:center;padding:40px 0")+"\">"+(isMgr()?"タスクがありません":"上のフォームからタスクを追加してください")+"</div>";
  }else{
    var statuses=["todo","doing","done"];
    for(var si=0;si<statuses.length;si++){
      var status=statuses[si];
      var tasks=board.filter(function(t){return t.status===status});
      if(!tasks.length) continue;
      var s=STMAP[status];
      html+="<div style=\"margin-bottom:18px\">";
      html+="<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">"+
        "<div style=\"width:7px;height:7px;border-radius:50%;background:"+s.c+"\"></div>"+
        "<span style=\""+lbl("color:"+s.c+";font-size:10px")+"\">"+s.l+"</span>"+
        "<span style=\""+lbl("font-size:9px")+"\">" + "&#x2014; " + tasks.length + "</span>"+
      "</div><div style=\"display:flex;flex-direction:column;gap:8px\">";
      for(var ti=0;ti<tasks.length;ti++){
        var task=tasks[ti];
        var isE=S.expandedTask===task.id;
        var statusSel="";
        if(!isMgr()){
          statusSel="<select onchange=\"window.A.updStatus('"+esc(vi)+"',"+task.id+",this.value)\" onclick=\"event.stopPropagation()\" style=\"font-size:11px;padding:3px 6px;border-radius:var(--rmd);border:.5px solid var(--br2);background:var(--bg2);color:"+STMAP[task.status].c+";width:auto\">";
          var stkeys=Object.keys(STMAP);
          for(var ski=0;ski<stkeys.length;ski++){
            var skv=stkeys[ski];
            statusSel+="<option value=\""+skv+"\""+( task.status===skv?" selected":"")+"\">"+STMAP[skv].l+"</option>";
          }
          statusSel+="</select>";
        }else{
          statusSel="<span style=\"font-size:10px;color:"+s.c+";font-weight:500;background:"+s.c+"14;padding:2px 8px;border-radius:20px;font-family:var(--mono)\">"+s.l+"</span>";
        }
        html+="<div style=\""+card("overflow:hidden;border-left:3px solid "+s.c)+"\">"+
          "<div style=\"display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer\" onclick=\"window.A.togTask("+task.id+")\">" +
            "<div style=\"flex:1\"><div style=\"font-size:13px;line-height:1.45\">"+esc(task.text)+"</div><div style=\""+lbl("font-size:9px;margin-top:4px")+"\">"+esc(task.createdAt)+"</div></div>"+
            "<div style=\"display:flex;align-items:center;gap:7px;flex-shrink:0\">"+statusSel+"<div style=\"font-size:12px;color:var(--tx2);transform:"+(isE?"rotate(180deg)":"none")+";transition:transform .2s\">&#x25BE;</div></div>"+
          "</div>";
        if(isE){
          html+="<div style=\"border-top:.5px solid var(--br3);padding:14px;display:flex;flex-direction:column;gap:14px\">";
          // content area
          html+="<div><div style=\""+lbl("margin-bottom:8px")+"\">" + "作業メモ・詳細" + "</div>";
          if(!isMgr()){
            if(S.editContent[task.id]!==undefined){
              html+="<textarea id=\"tc"+task.id+"\" rows=\"3\" style=\"resize:vertical;margin-bottom:7px\" oninput=\"window.A.setEC("+task.id+",this.value)\">"+esc(S.editContent[task.id])+"</textarea>"+
                "<div style=\"display:flex;gap:7px\"><button onclick=\"window.A.saveC('"+esc(vi)+"',"+task.id+")\" style=\"flex:1;font-size:11px;padding:7px;background:"+B+";color:white;border:none;border-radius:var(--rmd)\">保存</button>"+
                "<button onclick=\"window.A.canC("+task.id+")\" style=\"flex:1;font-size:11px;padding:7px;border:.5px solid var(--br3);border-radius:var(--rmd);color:var(--tx2)\">キャンセル</button></div>";
            }else{
              html+="<div onclick=\"window.A.opnC('"+esc(vi)+"',"+task.id+")\" style=\"min-height:48px;padding:10px 12px;background:var(--bg2);border-radius:var(--rmd);border:.5px dashed var(--br2);cursor:pointer;font-size:12px;color:"+(task.content?"var(--tx1)":"var(--tx2)")+";line-height:1.65;white-space:pre-wrap\">"+(task.content?esc(task.content):"クリックして作業内容を入力&#x2026;")+"</div>";
            }
          }else{
            html+="<div style=\"min-height:40px;padding:10px 12px;background:var(--bg2);border-radius:var(--rmd);border:.5px solid var(--br3);font-size:12px;color:"+(task.content?"var(--tx1)":"var(--tx2)")+";line-height:1.65;white-space:pre-wrap\">"+(task.content?esc(task.content):"（未記入）")+"</div>";
          }
          html+="</div>";
          // note area
          html+="<div><div style=\""+lbl("margin-bottom:8px;color:"+B)+"\">" + "マネージャーからのメモ" + "</div>";
          if(isMgr()){
            if(S.editNotes[task.id]!==undefined){
              html+="<textarea id=\"tn"+task.id+"\" rows=\"3\" style=\"resize:vertical;margin-bottom:7px\" oninput=\"window.A.setEN("+task.id+",this.value)\">"+esc(S.editNotes[task.id])+"</textarea>"+
                "<div style=\"display:flex;gap:7px\"><button onclick=\"window.A.saveN('"+esc(vi)+"',"+task.id+")\" style=\"flex:1;font-size:11px;padding:7px;background:"+B+";color:white;border:none;border-radius:var(--rmd)\">保存</button>"+
                "<button onclick=\"window.A.canN("+task.id+")\" style=\"flex:1;font-size:11px;padding:7px;border:.5px solid var(--br3);border-radius:var(--rmd);color:var(--tx2)\">キャンセル</button></div>";
            }else{
              html+="<div onclick=\"window.A.opnN('"+esc(vi)+"',"+task.id+")\" style=\"min-height:40px;padding:10px 12px;background:"+BF+";border-radius:var(--rmd);border:.5px dashed "+B+"40;cursor:pointer;font-size:12px;color:"+(task.note?"var(--tx2)":B)+";line-height:1.65\">"+(task.note?esc(task.note):"クリックしてメモを追加&#x2026;")+"</div>";
            }
          }else{
            html+="<div style=\"min-height:40px;padding:10px 12px;background:"+BF+";border-radius:var(--rmd);border:.5px solid "+B+"25;font-size:12px;color:"+(task.note?"var(--tx2)":B)+";line-height:1.65;opacity:"+(task.note?1:.65)+";white-space:pre-wrap\">"+
              "<b style=\"font-size:10px;display:block;margin-bottom:4px;color:"+B+";font-weight:500\">マネージャーより</b>"+(task.note?esc(task.note):"（まだメモがありません）")+"</div>";
          }
          html+="</div>";
          if(!isMgr()) html+="<button onclick=\"window.A.delTask('"+esc(vi)+"',"+task.id+")\" style=\"align-self:flex-start;font-size:11px;padding:4px 10px;border:.5px solid #B02A2A35;border-radius:var(--rmd);color:#B02A2A\">タスクを削除</button>";
          html+="</div>";
        }
        html+="</div>";
      }
      html+="</div></div>";
    }
  }
  html+="</div>";
  return html;
}

function loadData(){
  var proms=[];
  if(!isMgr()){
    proms.push(
      DB.get("clock:"+S.user).then(function(v){S.clockIn=v?JSON.parse(v.value):null}).catch(function(){S.clockIn=null}),
      DB.get("records:"+S.user).then(function(v){S.records=v?JSON.parse(v.value):[]}).catch(function(){S.records=[]})
    );
  }
  proms.push(DB.get("meeting-reqs").then(function(v){S.meetingReqs=v?JSON.parse(v.value):[]}).catch(function(){S.meetingReqs=[]}));
  Promise.all(INTERNS.map(function(name){
    return DB.get("board:"+name).then(function(v){return{k:name,d:v?JSON.parse(v.value):[]}}).catch(function(){return{k:name,d:[]}});
  })).then(function(rs){
    var all={};rs.forEach(function(r){all[r.k]=r.d});
    return Promise.all(proms).then(function(){S.boards=all;S.loaded=true;render()});
  });
}

setInterval(function(){
  if(!S.clockIn) return;
  var ms=Date.now()-S.clockIn;
  var d=document.getElementById("clock-display");
  var w=document.getElementById("clock-wage");
  if(d) d.textContent=fmtE(ms);
  if(w) w.textContent="\u00A5"+wage(Math.floor(ms/60000)).toLocaleString();
},1000);

window.A={
  selectUser:function(i){
    S.user=i===-1?"マネージャー":INTERNS[i];
    S.tab="manual";S.loaded=false;S.clockIn=null;S.records=[];S.boards={};
    S.meetingReqs=[];S.newTaskVal="";S.openStep=null;S.expandedTask=null;
    S.editContent={};S.editNotes={};S.showMeeting=false;S.meetingSent=false;
    render();loadData();
  },
  logout:function(){S.user=null;S.loaded=false;render()},
  setTab:function(t){S.tab=t;S.expandedTask=null;render()},
  toggleStep:function(n){S.openStep=S.openStep===n?null:n;render()},
  openMeeting:function(){S.showMeeting=true;S.meetingSent=false;render();
    var ta=document.getElementById("meeting-msg");
    if(ta) ta.value=S.user+"\u3067\u3059\u3002\n\u30df\u30fc\u30c6\u30a3\u30f3\u30b0\u3092\u304a\u9858\u3044\u3057\u305f\u3044\u306e\u3067\u3059\u304c\u3001\u3054\u90fd\u5408\u306e\u3088\u3044\u65e5\u6642\u306f\u3042\u308a\u307e\u3059\u304b\uff1f\n\n\u76f8\u8ac7\u5185\u5bb9\uff1a\n";
  },
  closeMeeting:function(){S.showMeeting=false;S.meetingSent=false;render()},
  sendMeeting:function(){
    var ta=document.getElementById("meeting-msg");
    var msg=ta?ta.value:"（メッセージなし）";
    var req={id:Date.now(),user:S.user,msg:msg,time:fmtDT(Date.now()),done:false};
    S.meetingReqs=[req].concat(S.meetingReqs);
    DB.set("meeting-reqs",JSON.stringify(S.meetingReqs));
    S.meetingSent=true;render();
  },
  markMtgDone:function(id){
    S.meetingReqs=S.meetingReqs.map(function(r){return r.id===id?Object.assign({},r,{done:true}):r});
    DB.set("meeting-reqs",JSON.stringify(S.meetingReqs));render();
  },
  clockIn:function(){var ts=Date.now();S.clockIn=ts;DB.set("clock:"+S.user,JSON.stringify(ts));render()},
  clockOut:function(){
    if(!S.clockIn) return;
    var out=Date.now();var dur=Math.max(1,Math.round((out-S.clockIn)/60000));
    var rec={id:out,date:fmtD(S.clockIn),clockIn:fmtT(S.clockIn),clockOut:fmtT(out),durationMin:dur};
    S.records=[rec].concat(S.records);S.clockIn=null;
    DB.set("records:"+S.user,JSON.stringify(S.records));
    DB.del("clock:"+S.user);render();
  },
  selBoard:function(i){S.selBoard=INTERNS[i];S.expandedTask=null;render()},
  setNTV:function(v){S.newTaskVal=v},
  addTask:function(){
    var inp=document.getElementById("new-task-input");
    var txt=(inp?inp.value:S.newTaskVal).trim();
    if(!txt) return;
    var task={id:Date.now(),text:txt,status:"todo",content:"",note:"",createdAt:fmtD(Date.now())};
    if(!S.boards[S.user]) S.boards[S.user]=[];
    S.boards[S.user]=[task].concat(S.boards[S.user]);
    S.newTaskVal="";
    DB.set("board:"+S.user,JSON.stringify(S.boards[S.user]));render();
  },
  updStatus:function(vi,id,status){
    S.boards[vi]=S.boards[vi].map(function(t){return t.id===id?Object.assign({},t,{status:status}):t});
    DB.set("board:"+vi,JSON.stringify(S.boards[vi]));render();
  },
  togTask:function(id){S.expandedTask=S.expandedTask===id?null:id;render()},
  opnC:function(vi,id){var t=(S.boards[vi]||[]).find(function(t){return t.id===id});S.editContent[id]=t?t.content||"":"";render()},
  setEC:function(id,v){S.editContent[id]=v},
  saveC:function(vi,id){
    var ta=document.getElementById("tc"+id);var val=ta?ta.value:S.editContent[id]||"";
    S.boards[vi]=S.boards[vi].map(function(t){return t.id===id?Object.assign({},t,{content:val}):t});
    delete S.editContent[id];DB.set("board:"+vi,JSON.stringify(S.boards[vi]));render();
  },
  canC:function(id){delete S.editContent[id];render()},
  opnN:function(vi,id){var t=(S.boards[vi]||[]).find(function(t){return t.id===id});S.editNotes[id]=t?t.note||"":"";render()},
  setEN:function(id,v){S.editNotes[id]=v},
  saveN:function(vi,id){
    var ta=document.getElementById("tn"+id);var val=ta?ta.value:S.editNotes[id]||"";
    S.boards[vi]=S.boards[vi].map(function(t){return t.id===id?Object.assign({},t,{note:val}):t});
    delete S.editNotes[id];DB.set("board:"+vi,JSON.stringify(S.boards[vi]));render();
  },
  canN:function(id){delete S.editNotes[id];render()},
  delTask:function(vi,id){
    S.boards[vi]=S.boards[vi].filter(function(t){return t.id!==id});
    S.expandedTask=null;DB.set("board:"+vi,JSON.stringify(S.boards[vi]));render();
  }
};

render();

</script>
</body>
</html>
